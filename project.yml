name: VolumeDialApp
options:
  bundleIdPrefix: com.mythreyen
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.mythreyen.VolumeDialApp
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: 14.2
    CODE_SIGN_ENTITLEMENTS: Config/VolumeDialApp.entitlements
    INFOPLIST_FILE: Config/Info.plist
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  VolumeDialApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Frontend
        optional: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
